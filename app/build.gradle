plugins {
    id 'com.android.application'
}

def getVersionCode(name) {
    def parts = name.split("\\.")
    int hotfix = parts[2] as int
    int minor = parts[1] as int
    int major = parts[0] as int
    def versionCode = major * 1000000 + minor * 1000 + hotfix
    println('Version Code: ' + versionCode)
    return versionCode
}

android {
    namespace 'com.dyPlaySpeed.Onely'
    // libxposed service AAR 要求 compileSdk >= 36
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.dyPlaySpeed.Onely"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode getVersionCode(appVersionName)
        versionName appVersionName
    }
    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (System.getenv('SIGNING_KEY_ALIAS')) {
                storeFile file('/tmp/keystore.jks')
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    // 注意：不能 exclude 'META-INF/**'，否则会把 META-INF/xposed/ 下的
    // java_init.list / module.prop / scope.list 从 APK 中排除，导致模块无法被识别。
    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'kotlin/**', 'google/**', '**.bin']
        }
    }
    compileOptions {
        // libxposed API 102 的 class 文件为 Java 17
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // libxposed API 102（只参与编译，不打入 APK）
    compileOnly 'io.github.libxposed:api:102.0.0'

    // 模块 App 侧的 Xposed service 桥接：把普通配置暴露为 RemotePreferences
    // 供 hook 进程通过 XposedInterface.getRemotePreferences() 只读访问
    // service 102.0.0 要求 compileSdk 37（AGP 8.13.2 最高支持 36），
    // 因此使用兼容 API 102 框架的 service 101.0.0（同样提供 RemotePreferences）
    implementation 'io.github.libxposed:service:101.0.0'
}

